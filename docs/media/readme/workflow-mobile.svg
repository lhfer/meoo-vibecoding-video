<style>text{font-family:Arial, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif}</style>
<rect x="0" y="0" width="800" height="770" rx="23" fill="#101116" /><rect x="0.75" y="0.75" width="798.5" height="768.5" rx="23" fill="none" stroke="#30313C" /><text x="44" y="63" font-size="24" font-weight="500" fill="#C1B3FF" letter-spacing="1.4">THE DIRECTOR’S WORKFLOW</text><path d="M74 133V652" stroke="#45404F" stroke-width="2"/><rect x="44" y="110" width="61" height="61" rx="30" fill="#21212B" stroke="#45404F" /><text x="74.5" y="150" font-size="25" font-weight="600" fill="#C6BCD9" text-anchor="middle">01</text><text x="139" y="138" font-size="33" font-weight="600" fill="#F6F4EE" >先看作品</text><text x="139" y="181" font-size="27" font-weight="400" fill="#ABA6B5" >体验产品 · 核对来源</text><rect x="44" y="228" width="61" height="61" rx="30" fill="#21212B" stroke="#45404F" /><text x="74.5" y="268" font-size="25" font-weight="600" fill="#C6BCD9" text-anchor="middle">02</text><text x="139" y="256" font-size="33" font-weight="600" fill="#F6F4EE" >再讲故事</text><text x="139" y="299" font-size="27" font-weight="400" fill="#ABA6B5" >明确受众 · 组织镜头</text><rect x="44" y="346" width="61" height="61" rx="30" fill="#C1B3FF" stroke="#625770" /><text x="74.5" y="386" font-size="25" font-weight="600" fill="#101116" text-anchor="middle">03</text><text x="139" y="374" font-size="33" font-weight="600" fill="#F6F4EE" >先做样片</text><text x="139" y="417" font-size="27" font-weight="400" fill="#ABA6B5" >脚本确认 · 带声开头</text><rect x="44" y="464" width="61" height="61" rx="30" fill="#21212B" stroke="#45404F" /><text x="74.5" y="504" font-size="25" font-weight="600" fill="#C6BCD9" text-anchor="middle">04</text><text x="139" y="492" font-size="33" font-weight="600" fill="#F6F4EE" >完成制作</text><text x="139" y="535" font-size="27" font-weight="400" fill="#ABA6B5" >配音配乐 · 字幕剪辑</text><rect x="44" y="582" width="61" height="61" rx="30" fill="#21212B" stroke="#45404F" /><text x="74.5" y="622" font-size="25" font-weight="600" fill="#C6BCD9" text-anchor="middle">05</text><text x="139" y="610" font-size="33" font-weight="600" fill="#F6F4EE" >交付发布</text><text x="139" y="653" font-size="27" font-weight="400" fill="#ABA6B5" >多画幅视频 · 可改工程</text><text x="44" y="727" font-size="25" font-weight="400" fill="#ABA6B5" >先确认，再推进。每一步都有明确产物。</text>
