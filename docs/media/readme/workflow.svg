<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="346" viewBox="0 0 1600 346" fill="none" role="img" aria-labelledby="title desc">
<title id="title">从真实作品到宣传视频的五步流程</title>
<desc id="desc">先看作品、再讲故事、先做样片、完成制作、交付发布。脚本与带声样片先确认，不伪造产品实测。</desc>
<defs></defs>
<style>text{font-family:Arial, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif}</style>
<rect x="0" y="0" width="1600" height="346" rx="22" fill="#101116" /><rect x="0.75" y="0.75" width="1598.5" height="344.5" rx="22" fill="none" stroke="#30313C" /><text x="52" y="64" font-size="19" font-weight="500" fill="#C1B3FF" letter-spacing="2.4">THE DIRECTOR’S WORKFLOW</text><text x="1548" y="64" font-size="22" font-weight="400" fill="#ADADB9" text-anchor="end">先确认，再推进。</text><path d="M80 119H1507" stroke="#45404F" stroke-width="1.5"/><rect x="52" y="94" width="49" height="49" rx="24" fill="#21212B" stroke="#45404F" /><text x="76.5" y="126" font-size="19" font-weight="600" fill="#C6BCD9" text-anchor="middle">01</text><text x="52" y="209" font-size="36" font-weight="600" fill="#F6F4EE" >先看作品</text><text x="52" y="259" font-size="23" font-weight="400" fill="#ABA6B5" >体验产品 · 核对来源</text><rect x="356" y="94" width="49" height="49" rx="24" fill="#21212B" stroke="#45404F" /><text x="380.5" y="126" font-size="19" font-weight="600" fill="#C6BCD9" text-anchor="middle">02</text><text x="356" y="209" font-size="36" font-weight="600" fill="#F6F4EE" >再讲故事</text><text x="356" y="259" font-size="23" font-weight="400" fill="#ABA6B5" >明确受众 · 组织镜头</text><rect x="660" y="94" width="49" height="49" rx="24" fill="#C1B3FF" stroke="#625770" /><text x="684.5" y="126" font-size="19" font-weight="600" fill="#101116" text-anchor="middle">03</text><text x="660" y="209" font-size="36" font-weight="600" fill="#F6F4EE" >先做样片</text><text x="660" y="259" font-size="23" font-weight="400" fill="#ABA6B5" >脚本确认 · 带声开头</text><rect x="964" y="94" width="49" height="49" rx="24" fill="#21212B" stroke="#45404F" /><text x="988.5" y="126" font-size="19" font-weight="600" fill="#C6BCD9" text-anchor="middle">04</text><text x="964" y="209" font-size="36" font-weight="600" fill="#F6F4EE" >完成制作</text><text x="964" y="259" font-size="23" font-weight="400" fill="#ABA6B5" >配音配乐 · 字幕剪辑</text><rect x="1268" y="94" width="49" height="49" rx="24" fill="#21212B" stroke="#45404F" /><text x="1292.5" y="126" font-size="19" font-weight="600" fill="#C6BCD9" text-anchor="middle">05</text><text x="1268" y="209" font-size="36" font-weight="600" fill="#F6F4EE" >交付发布</text><text x="1268" y="259" font-size="23" font-weight="400" fill="#ABA6B5" >多画幅视频 · 可改工程</text><text x="52" y="316" font-size="18" font-weight="400" fill="#827D8B" >每一步都有明确产物；不把静态示意当作真实演示。</text>
</svg>
